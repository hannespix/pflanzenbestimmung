name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (Single-File HTML)
        run: python3 build.py
      - name: Verteilkopien im Repo-Root sind aktuell
        run: git diff --exit-code -I 'id="buildStamp"' index.html pflanzenkenntnis.html pflanzen-lernen.html rechtliches.html
      - name: Offline-Check Wurzel = Lern-Tool (kein CDN, keine externen Ressourcen)
        run: python3 tools/check_offline.py dist/index.html
      - name: Offline-Check Weiterleitung /pruefung
        run: python3 tools/check_offline.py dist/pruefung/index.html
      - name: Offline-Check Impressum/Datenschutz (kein CDN, keine externen Ressourcen)
        run: python3 tools/check_offline.py dist/rechtliches.html
      - name: Offline-Check Prüfungswerkzeug (kein CDN, keine externen Ressourcen)
        run: python3 tools/check_offline.py dist/pflanzenkenntnis.html
      - name: Offline-Check Lern-Tool (kein CDN, keine externen Ressourcen)
        run: python3 tools/check_offline.py dist/pflanzen-lernen.html
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Die Pflanzendaten müssen sich byte-genau aus den amtlichen Excel-Listen in data/
      # ergeben (Konverter + die offengelegten Ergänzungsskripte). Schlägt fehl, wenn ein
      # Seed von Hand geändert wurde oder eine neue Excel nicht konvertiert ist – die
      # Aussage »unverändert aus den amtlichen Prüfungslisten« in Hilfe/Hinweis/Rechtlichem
      # bleibt so überprüfbar wahr.
      - name: Pflanzendaten = amtliche Listen (Seeds aus data/ reproduzierbar)
        run: bash tools/rebuild_seeds.sh && git diff --exit-code seeds/
      - name: Puppeteer (inkl. Chromium) installieren
        run: npm install --no-save puppeteer@23
      - name: Puppeteer-Smoke-Test Prüfungswerkzeug (gegen dist/)
        run: node tests/smoke.mjs
      - name: Puppeteer-Smoke-Test Lern-Tool (gegen dist/)
        run: node tests/learn.mjs
        env:
          DEBUG_STACK: "1"   # bei einer Zeitüberschreitung den Stack zeigen (welcher Wartepunkt)
      - name: PWA-Test (Manifest, Service Worker, Offline-Cache)
        run: node tests/pwa.mjs
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pflanzenkenntnis-html
          path: |
            dist/pflanzenkenntnis.html
            dist/pflanzen-lernen.html
